*{box-sizing:border-box}html,body{height:100%}body{margin:0;font:16px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--fg);display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--bd)}header h1{font-size:16px;margin:0;flex:1;white-space:nowrap}
.ib{min-width:44px;min-height:44px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--fg);font-size:15px;padding:0 10px}
#log{flex:1;overflow-y:auto;padding:12px}.b{max-width:92%;padding:10px 12px;border-radius:14px;margin:6px 0;background:var(--card);border:1px solid var(--bd)}
.me{margin-left:auto;background:var(--me);color:#fff;border:0}.b h3{margin:0 0 4px;font-size:16px}.b ol,.b ul{padding-left:20px;margin:4px 0}.b li{margin:3px 0}
.h{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);margin:8px 0 2px}.ref{font-size:12px;color:var(--mut);margin-top:6px}
.cv{font-size:13px;color:var(--warn);margin-top:4px}.hn{font-size:13px;color:var(--note)}.k{font-family:ui-monospace,monospace;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}.chips button{min-height:40px;padding:0 12px;border-radius:20px;border:1px solid var(--acc);background:transparent;color:var(--acc);font-size:14px}
form{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--bd);background:var(--bg)}
#q{flex:1;font-size:17px;padding:12px;border-radius:22px;border:1px solid var(--bd);background:var(--card);color:var(--fg)}#send{min-width:56px;border-radius:22px;border:0;background:var(--acc);color:#fff;font-size:16px}
table{border-collapse:collapse;width:100%;font-size:14px}td{border-bottom:1px solid var(--bd);padding:4px}
#menu{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:9}#menu.on{display:flex}#mnav{display:flex;gap:6px;overflow-x:auto;padding:8px 12px}
#mout{flex:1;overflow-y:auto;padding:0 12px 30px}.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;margin:8px 0}

  "Reset Toshiba drive: press STOP twice or switch main power off >10 s.",
  "Reset after pit access: a) RST 00>1; b) short MAN\u201324B for 1 s; c) car-top maintenance switch NORMAL\u2192INSPECTION\u2192NORMAL; d) press a floor/car button 6 times within 6\u201310 s.",
  "Inverter display PrA = safety series open (0V on 9FS); 0.0 = closed (+24Vdc on 9FS).",
  "Speed governor test: link AV and D, move down with emergency push button; UNPLUG STLM link after test (sheet 6B).",
  "Insulation test: car out of floor, disconnect MTB, open SLN, lift 'INSULATION TEST' wire from PE, unplug J3 & J11 (and Vega BU wires from 1000), test motor/mains/safety (1,2,3,5,6,9)/ALS to ground, reconnect all (sheet 31).",
  "Car display LED: DL2 slow flash = programmed; DL1 slow = serial OK, fast = broken link/incorrect serial (manual p3).",
  "After changing F00-F02/F19/F30 etc: MEM 00>1 then RST 03>1."

  ${errs.length?`<div class=h>Related errors</div>${errs.map(c=>"E "+pad(c)+" "+FX(c).name).join("<br>")}`:`<div class=cv>⚠ No error code in the manual refers to IS${n}.</div>`}
  <div class=cv>⚠ J3 pin mapping read from sheet 7B drawing.</div>`,[...errs.slice(0,2).map(c=>["E "+pad(c),"e"+c]),["Meter it out","meter it out"],["Show safety chain","safety chain"]]]}
 if(/safety (chain|circuit|line|series)|safety contacts|\bsic\b/.test(q)&&!/open|broken|won'?t|fault|trip/.test(q))return [chainHTML(),[["Meter it out","meter it out"],["Reset steps","reset steps"],["What's between 2 and 3","between 2 and 3"]]];
 // error code
 m=q.match(/\b(?:e|err|error|code|fault)\s*[-#:]?\s*0?(\d{1,2})\b/)||q.match(/^0?(\d{1,2})$/);
 if(m){const c=+m[1],f=FX(c);if(f){const near=[c-1,c+1].filter(FX);return [faultHTML(f),[["Reset steps","reset steps"],...(CM().some(s=>s.err_move==c||s.err_stop==c)?[["Meter it out","meter it out"]]:[]),...near.map(n=>["E "+pad(n),"e"+n])]]}
  return [`The manual lists codes E 00–E 31 only; there's no E ${e(m[1])}. I won't guess.`,[["List all faults","__browse_faults"]]]}
 // parameters
 m=q.match(/\b(mp|np|pp|f|t|m)\s*>?\s*0?(\d{1,2})\b/);
 if(m&&!/fuse|blow|blown|2a|amp/.test(q)){const p=D.params.find(p=>p.menu.toLowerCase()==m[1]&&p.num==+m[2]);
  if(p){const alt=m[1]=="f"&&+m[2]<=8?[["Fuse F"+m[2],"fuse f"+m[2]]]:[];return [parHTML(p),[...alt,["Next "+p.menu+pad(p.num+1),m[1]+(+m[2]+1)]]]}}
 const mm=q.match(/\b(mem|rst|sts|chc|chp|dem)\s*0?(\d)?/);if(mm){const ps=D.params.filter(p=>p.menu=="Other"&&p.num.toLowerCase().startsWith(mm[1]));if(ps.length)return [ps.map(parHTML).join("<hr>"),mm[1]=="rst"?[["Reset steps","reset steps"]]:[]]}
 // terminals/io
 let words=q.replace(/fuse/,"").trim().split(/\s+/);let hits=[];
 for(let i=0;i<words.length;i++){for(const w of [words[i]+(words[i+1]||""),words[i]+" "+(words[i+1]||""),words[i]]){const h=ioFind(w);if(h.length){hits.push(...h);break}}}
 const tm=q.match(/\bj\s?(\d{1,2})\s*[, ]\s*(\d{1,2})\b/);if(tm){const t=`J${tm[1]},${tm[2]}`;hits.push(...D.io.filter(x=>x.terminal.toUpperCase().startsWith(t)))}
 const im=q.match(/\b(in|out)\s?(\d{1,2})\b/);if(im){const t=(im[1]+pad(im[2])).toUpperCase();hits.push(...D.io.filter(x=>x.terminal.toUpperCase().includes(t)))}
 const km=q.match(/\bk\s?(\d{1,2})\b/);if(km)hits.push(...D.io.filter(x=>x.terminal.toUpperCase().split(" ")[0]=="K"+km[1]));
 ["apa","apb","cp","ax","bkd","bat","lc","pnet","9fs"].forEach(r=>{if(new RegExp("\\b"+r+"\\b").test(q))hits.push(...D.io.filter(x=>x.terminal.toLowerCase().split(/[ /]/).includes(r)))});
 // chain device names
 const segHit=CM().filter(s=>s.id!="END"&&s.id!="FC_IS4"&&new RegExp("\\b"+s.id.toLowerCase()+"\\b").test(q));
 hits=[...new Set(hits)];
 const sc=score(q);
 const ranked=Object.entries(sc.f).sort((a,b)=>b[1]-a[1]);
 const strongSym=ranked.length&&ranked[0][1]>=1.5;
 if(segHit.length&&!strongSym||segHit.length==1&&/what|where|which/.test(q)){return [segHit.map(segHTML).join("<hr>"),[...segHit.flatMap(s=>[s.err_stop,s.err_move]).filter(x=>x!=null).slice(0,2).map(c=>["E "+pad(c),"e"+c]),["Meter it out","meter it out"]]]}
 if(hits.length&&!strongSym){const extra=hits.flatMap(h=>CM().filter(s=>h.terminal.includes(s.monitor.split(" ")[0])&&/^IS/.test(s.monitor)).slice(0,0));
  return [hits.slice(0,4).map(ioHTML).join("<hr>"),hits.some(h=>/IS\d/.test(h.terminal))?[["Show safety chain","safety chain"]]:[["Show safety chain","safety chain"],["Reset steps","reset steps"]]]}
 if(strongSym||sc.chain>=2){const top=ranked.slice(0,3).map(([c])=>FX(+c));
  let h=`<h3>Most likely</h3>`;
  if(sc.chain>=1)h+=`<div>This sounds like a <b>safety chain</b> problem. Read 'sic:' on the programmer (first 0 bit = open section) and the E menu (last error).</div>`;
  const segs=Object.keys(sc.seg).map(id=>CM().find(s=>s.id==id)).filter(Boolean);
  if(top[0])h+=`<div class=h>Best match</div>`+faultHTML(top[0]);
  if(segs.length)h+=`<div class=h>Contacts to check</div><ul>${segs.map(s=>`<li><span class=k>${e(s.device)}</span> – ${e(s.desc)} <span class=ref>[${e(s.location)}] ${e(s.t_in)}→${e(s.t_out)}, ${e(s.monitor)}</span></li>`).join("")}</ul>`;
  if(sc.door&&TYPE=='sliding')h+=doorHTML();const io=Object.keys(sc.io).map(t=>D.io.find(x=>x.terminal==t)).filter(Boolean);if(io.length)h+=`<div class=h>Related</div>`+io.map(ioHTML).join("<hr>");
  const ps=Object.keys(sc.p).map(k=>D.params.find(p=>p.menu+pad(p.num)==k.replace(/(\d+)/,x=>pad(x)))).filter(Boolean);if(ps.length)h+=ps.map(parHTML).join("<hr>");
  h+=`<div class=cv>⚠ Matched on keywords – confirm with the E menu (last error code) on the programmer.</div>`;
  const ch=top.slice(1).map(f=>[`E ${pad(f.code)} ${f.name.replace(/^ERR[_-]/,"")}`,"e"+f.code]);
  if(sc.chain>=1)ch.unshift(["Meter it out","meter it out"]);ch.push(["Reset steps","reset steps"]);
  return [h,ch]}
 const ps=Object.keys(sc.p).map(k=>D.params.find(p=>p.menu+pad(p.num)==k.replace(/(\d+)/,x=>pad(x)))).filter(Boolean);if(ps.length)return [ps.map(parHTML).join("<hr>"),[]];
 // full-text fallback with weak hits
 const tk=q.split(/[^a-z0-9]+/).filter(t=>t.length>2);
 const weak=[...D.params.filter(p=>tk.some(t=>p.desc.toLowerCase().includes(t))).slice(0,3).map(p=>[p.menu+" "+(typeof p.num=="number"?pad(p.num):p.num),p.menu+p.num]),...ranked.slice(0,2).map(([c])=>["E "+pad(c),"e"+c])];
 return [`<h3>Not sure</h3>I couldn't match that confidently to anything in the ED1 manual or HLB schematic, so I won't guess. Try an error code from the E menu (e.g. "E 14"), an input ("IS3 off"), a terminal ("J3,5"), a parameter ("F06") or a symptom ("doors won't close").`,[...weak.slice(0,3),["Safety chain","safety chain"],["Help","help"]]]}
function doorHTML(){const x=D.door;return `<div class=h>Sliding door – relevant I/O & settings</div><ul>${x.outputs.map(o=>`<li>${e(o)}</li>`).join("")}</ul><ul>${x.params.map(o=>`<li>${e(o)}</li>`).join("")}</ul><div class=ref>Programmer: watch out0/out1 (open A/B, close) and sic: bits 4 (VF5+) and 8 (PC/PC1) while cycling the door. 📄 ${x.sheets.map(e).join("; ")}</div><div class=cv>⚠ Inferred: the manual has no sliding-door troubleshooting procedure; the Fermator operator's own fault codes are not in these documents.</div>`}
const HELP=`<h3>G'day – ED1 / HLB fault bot</h3>Type what you're seeing. Examples:<ul><li>"E 14" or "err 5" – error code from the E menu</li><li>"lift won't move, door open light on"</li><li>"IS3 off" / "safety chain open" / "meter it out"</li><li>"what's between terminal 2 and 3"</li><li>"what is F06", "J3,5", "K9", "F5 fuse"</li></ul><div class=ref>Works offline. Sources: ED1 manual E-DOC-00000035 Rev01.4, HLB schematic E-SCH-00000015 Rev08.</div>`;
const STARTCH=[["Lift won't move","lift won't move"],["Safety chain open","safety chain open"],["Meter it out","meter it out"],["E 14","e14"],["Doors won't close","doors won't close"],["Door keeps reopening","door keeps reopening"],["Reset steps","reset steps"]];
function ask(q,label){if(q.startsWith("__browse_")){openMenu(q.slice(9));return}
 bub(e(label||q),true);const [h,c]=answer(q);bub(h);chips(c)}
$("#f").onsubmit=ev=>{ev.preventDefault();const v=$("#q").value.trim();if(!v)return;$("#q").value="";ask(v)};
$("#clr").onclick=()=>{log.innerHTML="";M=null;bub(HELP);chips(STARTCH)};
// ---------- browse ----------
const T=[["faults","Faults"],["chain_model","Safety chain"],["io","I/O"],["params","Params"],["diagnostics","Diag"],["pages","Pages"],["tips","Tips"]];
const BR={faults:f=>`<details><summary><b>E ${pad(f.code)}</b> ${e(f.name)}</summary>${faultHTML(f)}</details>`,chain_model:segHTML,io:ioHTML,params:parHTML,diagnostics:x=>`<span class=k>${e(x.screen)}</span> ${e(x.desc)}`,pages:x=>`<span class=k>PDF p${x.pdf_page}</span> ${x.sheet?"· sheet "+e(x.sheet):""}<div>${e(x.title)}</div>`,tips:x=>e(x)};
function openMenu(k){k=k||"faults";$("#menu").classList.add("on");$("#mnav").innerHTML=T.map(([a,l])=>`<button class=ib data-k=${a} style="${a==k?"background:var(--acc);color:#fff":""}">${l}</button>`).join("");$("#mout").innerHTML=D[k].map(x=>`<div class=c>${BR[k](x)}</div>`).join("")}
$("#mnav").onclick=ev=>{if(ev.target.dataset.k)openMenu(ev.target.dataset.k)};$("#mbtn").onclick=()=>openMenu();$("#mclose").onclick=()=>$("#menu").classList.remove("on");
$('#lt').value=TYPE;$('#lt').onchange=ev=>{TYPE=localStorage.liftType=ev.target.value;M=null;bub(`Lift type set to <b>${TN()}</b>. Safety chain, meter-out and answers now follow ${TYPE=='sliding'?'sheets 7D/32D':'sheets 7B/32A'}.`);chips([["Show safety chain","safety chain"]])};
bub(HELP);chips(STARTCH);
</script></body></html>
